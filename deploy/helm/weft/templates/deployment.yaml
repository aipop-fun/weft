apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weft.fullname" . }}
  labels:
    app: weft
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: weft
  template:
    metadata:
      labels:
        app: weft
    spec:
      containers:
        - name: weft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: api, containerPort: 3000 }
            - { name: web, containerPort: 3001 }
          env:
            - { name: WEFT_DB, value: /data/weft.db }
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "weft.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
